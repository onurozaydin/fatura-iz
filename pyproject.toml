[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "faturaiz"
version = "0.1.0"
description = "Explainable, cost-aware duplicate-invoice triage for accounts payable teams"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Onur Ibrahim Ozaydin" }]
dependencies = [
  "fastapi>=0.116,<1",
  "joblib>=1.5,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
faturaiz = "faturaiz.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/faturaiz"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["faturaiz"]

[[tool.mypy.overrides]]
module = ["joblib", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=faturaiz --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
